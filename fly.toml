app = "kolo-arc-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  KOLO_NETWORK = "mainnet"
  KOLO_CORS_ORIGINS = "https://kolo-arc.vercel.app"
  PORT = "8080"

[mounts]
  source = "kolo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/kolo/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
